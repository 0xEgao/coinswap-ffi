name: React Native Tests

on:
  push:
    branches: [main]
    paths:
      - "openswap-react-native/**"
      - "ffi-commons/**"
      - ".github/workflows/test-react-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "openswap-react-native/**"
      - "ffi-commons/**"
      - ".github/workflows/test-react-native.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "27.3.13750724"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-react-native:
    name: Test React Native Bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openswap-react-native/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-react-native-${{ hashFiles('ffi-commons/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-react-native-
            ${{ runner.os }}-cargo-

      - name: Install system and JavaScript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config
          cd openswap-react-native
          npm ci

      - name: Configure Android NDK tooling
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -Eq '(^|[[:space:]])4\.1\.2([[:space:]]|$)'; then
            cargo install cargo-ndk --version 4.1.2 --locked --force
          fi
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${android_sdk_root}"
          ndk_home="${android_sdk_root}/ndk/${ANDROID_NDK_VERSION}"
          if [ ! -d "${ndk_home}" ]; then
            sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          fi
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Build and smoke-test the Android native bridge
        working-directory: ./openswap-react-native
        run: |
          npm run ubrn:android
          npm run test:android

      - name: Build host library and generate N-API test bindings
        run: |
          cargo build --manifest-path ffi-commons/Cargo.toml
          library_path="${GITHUB_WORKSPACE}/ffi-commons/target/debug/libopenswap_ffi.so"
          cd ffi-commons
          ../openswap-react-native/node_modules/.bin/ubrn generate napi bindings \
            --library \
            --ts-dir "${GITHUB_WORKSPACE}/openswap-react-native/src/generated" \
            --lib-absolute \
            --no-format \
            "${library_path}"

      - name: Run React Native wrapper contract tests
        working-directory: ./openswap-react-native
        run: npx jest tests/jest/api.contract.test.ts --runInBand

      - name: Set up Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull openswap/bitcoin-mutinynet:latest && docker pull openswap/openswap:master; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          ./ffi-docker-setup start
          ./ffi-docker-setup wait-ready

      - name: Run isolated React Native generated-binding live swaps
        working-directory: ./openswap-react-native
        timeout-minutes: 40
        run: |
          set -euo pipefail
          for test_case in legacy_rpc taproot_rpc legacy_electrum taproot_electrum; do
            echo "Running React Native swap test: ${test_case}"
            timeout --signal=TERM --kill-after=30s 10m \
              env OPENSWAP_SWAP_CASE="${test_case}" npm run test:live
          done

      - name: Collect failure logs
        if: failure()
        working-directory: ./ffi-commons
        run: docker compose -f docker-compose.electrum-regtest.yml logs --no-color > "${RUNNER_TEMP}/react-native-docker.log" 2>&1 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-native-integration-logs
          path: |
            ${{ runner.temp }}/react-native-docker.log
            /tmp/openswap-react-native-live/**/debug.log
            ffi-commons/.block-mining.log
          retention-days: 7

      - name: Clean up Docker environment
        if: always()
        working-directory: ./ffi-commons
        run: ./ffi-docker-setup stop || true
