name: Python Tests

on:
  push:
    branches:
      - main
    paths:
      - 'openswap-python/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-python.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'openswap-python/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-python:
    name: Test Python Bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'openswap-python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Python FFI build artifacts
        id: cache-python-ffi-build
        uses: actions/cache@v4
        with:
          path: |
            openswap-python/src/openswap/native/linux-x86_64/
            openswap-python/src/openswap/openswap.py
          key: ${{ runner.os }}-python-ffi-build-${{ hashFiles('ffi-commons/Cargo.lock', 'ffi-commons/Cargo.toml', 'ffi-commons/src/**', 'ffi-commons/uniffi.toml', 'openswap-python/build-scripts/development/build-dev-linux-x86_64.sh') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Build FFI bindings
        if: steps.cache-python-ffi-build.outputs.cache-hit != 'true'
        working-directory: ./openswap-python
        run: bash ./build-scripts/development/build-dev-linux-x86_64.sh

      - name: Run network-free Python API contract tests
        working-directory: ./openswap-python
        run: python3 test/api_contract_test.py -v

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Setup Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull openswap/bitcoin-mutinynet:latest && docker pull openswap/openswap:master; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 2 RPC makers + 2 Electrum makers.
          ./ffi-docker-setup start

      - name: Check Docker containers status
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          
          echo -e "\n=== Bitcoin Core Logs ==="
          docker logs openswap-bitcoind --tail 50 || true
          
          echo -e "\n=== Tor Logs ==="
          docker logs openswap-tor --tail 30 || true
          
          echo -e "\n=== electrs ==="
          docker logs openswap-electrs --tail 30 || true

          echo -e "\n=== Maker1 Logs ==="
          docker logs openswap-makerd1 --tail 30 || true
          
          echo -e "\n=== Electrum Maker2 Logs ==="
          docker logs openswap-makerd2 --tail 30 || true

          echo -e "\n=== Host Port Connectivity ==="
          for i in {1..20}; do
            all_ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null && echo "port $port ok" || { echo "port $port not reachable"; all_ok=false; }
            done
            if $all_ok; then
              echo "All ports forwarded to host!"; break
            fi
            echo "Retry $i/20..."
            sleep 2
          done

      - name: Wait for local makers
        run: |
          # The test polls these exact onion addresses, avoiding unrelated
          # makers announced by concurrent CI jobs on public Nostr relays.
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "openswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              onion=$(docker logs "openswap-$m" 2>&1 | grep -c "Generated new Tor Hidden Service Hostname" || true)
              if [ "$setup" -ge 1 ] && [ "$onion" -ge 1 ]; then
                echo "  $m ready (setup=$setup onion=$onion)"
              else
                echo "  $m not ready (setup=$setup onion=$onion)"; ok=false
              fi
            done
            $ok && { echo "both local makers ready (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 5
          done
          $ok || { echo "Timed out waiting for local makers"; exit 1; }

      - name: Run isolated Python swap tests
        working-directory: ./openswap-python
        run: |
          set -euo pipefail

          # Keep the stack alive, but use a fresh interpreter for each native
          # Taker so completed cases cannot retain Tor connections.
          for test_case in legacy_rpc taproot_rpc legacy_electrum taproot_electrum; do
            echo "Running Python swap test: ${test_case}"
            timeout --signal=TERM --kill-after=30s 10m \
              python3 -u test/swap_test.py "${test_case}"
          done

      - name: Cleanup Docker environment
        if: always()
        working-directory: ./ffi-commons
        run: |
          ./ffi-docker-setup stop || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-logs
          path: |
            ~/.openswap/taker/debug.log
            ffi-commons/.openswap-docker-stack/logs/
          retention-days: 7
