name: Test Swift

# Tests the Swift bindings for cs-ffi on macOS.
# Triggered by changes to cs-ffi or openswap-swift directories.

on:
  push:
    branches:
      - main
    paths:
      - "ffi-commons/**"
      - "openswap-swift/**"
  pull_request:
    branches:
      - main
    paths:
      - "ffi-commons/**"
      - "openswap-swift/**"

permissions: {}

jobs:
  test:
    name: "Test Swift library"
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: ./openswap-swift

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-swift-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          # Do not cache .build: Swift PCH files embed the absolute checkout
          # path and cannot be reused after a repository rename or relocation.
          path: ~/.swiftpm/
          key: ${{ runner.os }}-swiftpm-v2-${{ hashFiles('openswap-swift/Package.swift', 'openswap-swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-v2-

      - name: Clean SwiftPM build artifacts
        run: swift package clean

      - name: Setup Docker on macOS
        uses: douglascamata/setup-docker-macos-action@v1.1.0
        with:
          colima-network-address: false

      - name: Check Docker
        run: |
          docker version
          docker info

      - name: Setup Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull openswap/bitcoin-mutinynet:latest && docker pull openswap/openswap:master; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 2 RPC makers + 2 Electrum makers.
          ./ffi-docker-setup start

      - name: Check Docker containers status
        run: |
          echo "=== Docker Containers ==="
          docker ps -a

          echo -e "\n=== Bitcoin Core Logs ==="
          docker logs openswap-bitcoind --tail 50 || true

          echo -e "\n=== Tor Logs ==="
          docker logs openswap-tor --tail 30 || true

          echo -e "\n=== electrs ==="
          docker logs openswap-electrs --tail 30 || true

          echo -e "\n=== Maker1 Logs ==="
          docker logs openswap-makerd1 --tail 30 || true

          echo -e "\n=== Electrum Maker2 Logs ==="
          docker logs openswap-makerd2 --tail 30 || true

          echo -e "\n=== Host Port Connectivity ==="
          for i in {1..20}; do
            all_ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null && echo "port $port ok" || { echo "port $port not reachable"; all_ok=false; }
            done
            if $all_ok; then
              echo "All ports forwarded to host!"; break
            fi
            echo "Retry $i/20..."
            sleep 2
          done
          if ! $all_ok; then
            echo "Port forwarding failed. Colima status:"
            colima status || true
            colima list || true
            exit 1
          fi

      - name: "Build Swift package"
        run: bash ./build-xcframework-ci.sh

      - name: Wait for local makers
        run: |
          # The test polls these exact onion addresses, avoiding unrelated
          # makers announced by concurrent CI jobs on public Nostr relays.
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "openswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              onion=$(docker logs "openswap-$m" 2>&1 | grep -c "Generated new Tor Hidden Service Hostname" || true)
              if [ "$setup" -ge 1 ] && [ "$onion" -ge 1 ]; then
                echo "  $m ready (setup=$setup onion=$onion)"
              else
                echo "  $m not ready (setup=$setup onion=$onion)"; ok=false
              fi
            done
            $ok && { echo "both local makers ready (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 5
          done
          $ok || { echo "Timed out waiting for local makers"; exit 1; }

      - name: "Run isolated Swift live swap tests"
        timeout-minutes: 35
        run: |
          set -euo pipefail

          # SwiftPM reuses its build output, but each invocation gets a fresh
          # XCTest process and therefore a fresh set of Tor resources.
          for test_case in testLegacyRpc testTaprootRpc testLegacyElectrum testTaprootElectrum; do
            echo "Running Swift swap test: ${test_case}"
            sudo -E swift test \
              --filter "OpenswapTests.LiveSwapTests/${test_case}"
          done

      - name: Cleanup Docker environment
        if: always()
        working-directory: ./ffi-commons
        run: |
          ./ffi-docker-setup stop || true
          colima stop || true
