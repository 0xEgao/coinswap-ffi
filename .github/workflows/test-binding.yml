name: Openswap Rust Bindings Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '**/*.gitignore'
      - '.editorconfig'
      - 'docs/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-taker:
    name: Test RPC + Electrum Taker Methods
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-taker-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Run network-free FFI contract tests
        working-directory: ./ffi-commons
        run: cargo test contract_tests -- --nocapture

      - name: Run network-free Node adapter contract tests
        working-directory: ./openswap-js
        run: cargo test --lib

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Setup Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull openswap/bitcoin-mutinynet:latest && docker pull openswap/openswap:master; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 1 RPC maker + 1 Electrum maker.
          ./ffi-docker-setup start

      - name: Check stack readiness
        run: |
          # Wait for host ports and for this job's two local makers to expose
          # their onion addresses. The test itself verifies Tor connectivity.
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          for i in {1..20}; do
            ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null || ok=false
            done
            $ok && { echo "all ports reachable"; break; }
            echo "waiting for ports ($i/20)..."; sleep 2
          done
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "openswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              onion=$(docker logs "openswap-$m" 2>&1 | grep -c "Generated new Tor Hidden Service Hostname" || true)
              if [ "$setup" -ge 1 ] && [ "$onion" -ge 1 ]; then
                echo "  $m ready (setup=$setup onion=$onion)"
              else
                echo "  $m not ready (setup=$setup onion=$onion)"; ok=false
              fi
            done
            $ok && { echo "both local makers ready (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 5
          done
          $ok || { echo "Timed out waiting for local makers"; exit 1; }

      - name: Run isolated taker swap tests (legacy/taproot x rpc/electrum)
        working-directory: ./ffi-commons
        timeout-minutes: 40
        run: |
          set -euo pipefail

          # A native Taker retains background Tor services. Give every swap a
          # fresh test process so an earlier case cannot starve a later one.
          for test_case in legacy_rpc taproot_rpc legacy_electrum taproot_electrum; do
            echo "Running Rust swap test: ${test_case}"
            timeout --signal=TERM --kill-after=30s 10m \
              env OPENSWAP_SWAP_CASE="${test_case}" \
              cargo test tests::swap_test::main -- --nocapture --exact
          done

      - name: Cleanup Docker environment
        if: always()
        working-directory: ./ffi-commons
        run: |
          ./ffi-docker-setup stop || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taker-test-logs
          path: |
            ~/.openswap/taker/debug.log
            ffi-commons/.openswap-docker-stack/logs/
          retention-days: 7
