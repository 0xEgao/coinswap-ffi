name: Android Tests

on:
  push:
    branches:
      - main
    paths:
      - 'openswap-kotlin/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-kotlin.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'openswap-kotlin/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-kotlin.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-kotlin:
    name: Test Kotlin Bindings
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-kotlin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            openswap-kotlin/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin FFI build artifacts
        id: cache-kotlin-ffi-build
        uses: actions/cache@v4
        with:
          path: |
            openswap-kotlin/lib/src/main/jniLibs/x86_64/
            openswap-kotlin/lib/src/main/kotlin/
          key: ${{ runner.os }}-kotlin-ffi-build-${{ hashFiles('ffi-commons/Cargo.lock', 'ffi-commons/Cargo.toml', 'ffi-commons/src/**', 'ffi-commons/uniffi.toml', 'openswap-kotlin/build-scripts/development/build-dev-linux-jvm.sh', 'openswap-kotlin/lib/build.gradle.kts') }}

      - name: "Build Android library"
        if: steps.cache-kotlin-ffi-build.outputs.cache-hit != 'true'
        working-directory: ./openswap-kotlin
        run: |
          chmod +x build-scripts/development/build-dev-linux-jvm.sh
          bash ./build-scripts/development/build-dev-linux-jvm.sh

      - name: "Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull openswap/bitcoin-mutinynet:latest && docker pull openswap/openswap:master; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 2 RPC makers + 2 Electrum makers.
          ./ffi-docker-setup start

      - name: Check stack readiness
        run: |
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          for i in {1..20}; do
            ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null || ok=false
            done
            $ok && { echo "all ports reachable"; break; }
            echo "waiting for ports ($i/20)..."; sleep 2
          done

      - name: Wait for local makers
        run: |
          # The Kotlin test polls these exact onion addresses through Tor. Do
          # not use public Nostr discovery: another CI job may publish makers
          # backed by a different regtest chain.
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "openswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              onion=$(docker logs "openswap-$m" 2>&1 | grep -c "Generated new Tor Hidden Service Hostname" || true)
              if [ "$setup" -ge 1 ] && [ "$onion" -ge 1 ]; then
                echo "  $m ready (setup=$setup onion=$onion)"
              else
                echo "  $m not ready (setup=$setup onion=$onion)"; ok=false
              fi
            done
            $ok && { echo "both local makers ready (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 5
          done
          $ok || { echo "Timed out waiting for local makers"; exit 1; }

      - name: Run isolated Kotlin swap tests
        working-directory: ./openswap-kotlin
        run: |
          set -euo pipefail
          chmod +x gradlew

          # Each no-daemon invocation creates a fresh test worker/JVM, while
          # Gradle reuses compiled outputs from the previous invocation.
          for test_case in legacyRpcSwap taprootRpcSwap legacyElectrumSwap taprootElectrumSwap; do
            echo "Running Kotlin swap test: ${test_case}"
            timeout --signal=TERM --kill-after=30s 10m \
              ./gradlew :lib:testDebugUnitTest \
                --tests "org.openswap.SwapTest.${test_case}" \
                --no-daemon \
                --stacktrace
          done

      - name: Cleanup Docker
        if: always()
        working-directory: ./ffi-commons
        run: |
          ./ffi-docker-setup stop || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-results
          path: |
            openswap-kotlin/lib/build/reports/tests/
            openswap-kotlin/lib/build/test-results/
            ~/.openswap/taker/debug.log
          retention-days: 7
